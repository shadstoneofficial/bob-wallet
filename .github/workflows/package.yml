name: Package for distribution

on:
  workflow_dispatch:
    inputs:
      run_macos_signing_test:
        description: "Run the Developer ID macOS signing/notarization test job"
        required: true
        default: false
        type: boolean
      mac_arch:
        description: "macOS architecture for the signing test"
        required: true
        default: "arm64"
        type: choice
        options:
          - arm64
          - x64

jobs:
  package:
    if: ${{ !inputs.run_macos_signing_test }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]

        # OS-specific commands/variables
        include:
          - os: ubuntu-22.04
            cmd_package: npm run package-linux
            out_filename: Bob-linux
          - os: windows-latest
            cmd_package: npm run package-win
            out_filename: Bob-windows
          - os: macos-latest
            cmd_package: npm run package-mac
            out_filename: Bob-macos-intel

    runs-on: ${{matrix.os}}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      # https://github.com/actions/setup-node/issues/280#issuecomment-1139455898
      - name: Update node-gyp (windows only)
        if: startsWith(matrix.os, 'windows')
        run: |
          $WhereNode = Get-Command node | Select-Object -ExpandProperty Definition
          $NodeDirPath = Split-Path $WhereNode -Parent
          $NodeModulesPath = $NodeDirPath + "\node_modules\npm\node_modules\@npmcli\run-script"
          cd $NodeModulesPath
          npm install node-gyp@10.3.1

      - name: Install dependencies (linux only)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt update && sudo apt install libudev-dev libusb-1.0-0-dev -y

      - name: Install npm packages
        run: npm i

      - name: Install dmg-license (macos only)
        if: startsWith(matrix.os, 'macos')
        run: npm i dmg-license --no-save

      - name: Generate Executable
        run: ${{ matrix.cmd_package }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Store artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out_filename }}
          path: |
            release/*.AppImage
            release/*.msi
            release/*.dmg

  macos-signing-test:
    if: ${{ inputs.run_macos_signing_test }}
    name: Sign, notarize, and staple macOS ${{ inputs.mac_arch }}
    runs-on: macos-latest
    timeout-minutes: 300

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install dmg-license
        run: npm i dmg-license --no-save

      - name: Run tests
        run: npm test

      - name: Build signed, notarized, and stapled macOS package
        run: npm run package-mac-notarized
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_MAX_ATTEMPTS: "240"
          NOTARY_SLEEP_SECONDS: "30"
          MAC_ARCHES: ${{ inputs.mac_arch }}
          DEBUG: electron-builder

      - name: Upload notarization diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bob-wallet-macos-${{ inputs.mac_arch }}-notarization-diagnostics
          path: |
            release/notary/*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify macOS code signature
        shell: bash
        run: |
          app_path="$(find release -maxdepth 3 -name "Bob LearnHNS.app" -type d | sort | head -n 1)"
          if [ -z "${app_path}" ]; then
            echo "No macOS app bundle found in release" >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "${app_path}"
          spctl --assess --type execute --verbose "${app_path}"

      - name: Generate checksums
        shell: bash
        run: |
          cd release
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          const skip = new Set(['builder-debug.yml', 'builder-effective-config.yaml', 'SHA256SUMS.txt']);
          const files = fs.readdirSync('.')
            .filter((file) => fs.statSync(file).isFile())
            .filter((file) => !skip.has(file))
            .sort();

          const lines = files.map((file) => {
            const hash = crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            return `${hash}  ${file}`;
          });

          fs.writeFileSync('SHA256SUMS.txt', `${lines.join('\n')}\n`);
          NODE
          cat SHA256SUMS.txt

      - name: Upload signed macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: bob-wallet-macos-${{ inputs.mac_arch }}-signed-notarized
          compression-level: 0
          path: |
            release/*.dmg
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Attest signed macOS artifact
        continue-on-error: true
        uses: actions/attest@v4
        with:
          subject-checksums: release/SHA256SUMS.txt
